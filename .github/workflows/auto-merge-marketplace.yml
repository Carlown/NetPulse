name: Auto-merge Marketplace PRs

on:
  pull_request_target:
    paths:
      - 'marketplace/**'
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.draft
    steps:
      - name: Validate and auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.issue.number;

            // 1. 检查 PR 修改的文件是否全部在 marketplace/ 目录下
            const { data: files } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: pr, per_page: 100,
            });

            const illegal = files.filter(
              f => !f.filename.startsWith('marketplace/')
            );
            if (illegal.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr,
                body: '❌ 自动合并被拒绝：PR 包含 marketplace/ 之外的文件。\n\n' +
                      illegal.map(f => '- ' + f.filename).join('\n'),
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: pr,
                state: 'closed',
              });
              core.setFailed('Non-marketplace files detected, PR closed.');
              return;
            }

            // 2. 检查 plugins-index.json 格式是否合法（仅当该文件被修改时）
            const idxFile = files.find(f => f.filename === 'marketplace/plugins-index.json');
            if (idxFile) {
              try {
                const { data: content } = await github.rest.repos.getContent({
                  owner, repo, path: 'marketplace/plugins-index.json',
                  ref: context.payload.pull_request.head.sha,
                });
                const json = JSON.parse(
                  Buffer.from(content.content, 'base64').toString('utf-8')
                );
                if (!Array.isArray(json.plugins)) {
                  throw new Error('"plugins" is not an array');
                }
                const ids = new Set();
                for (const p of json.plugins) {
                  if (!p.id || !p.name || !p.version) {
                    throw new Error('plugin missing required fields (id/name/version)');
                  }
                  if (ids.has(p.id)) {
                    throw new Error('duplicate plugin id: ' + p.id);
                  }
                  ids.add(p.id);
                }
              } catch (e) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr,
                  body: '❌ plugins-index.json 校验失败：' + e.message,
                });
                core.setFailed('Index validation failed: ' + e.message);
                return;
              }
            }

            // 3. 通过验证，自动合并
            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr,
                merge_method: 'squash',
                commit_title: `[Auto-merge] ${context.payload.pull_request.title}`,
                commit_message: `Automatically merged via NetPulse marketplace bot.\nPR #${pr} by @${context.payload.pull_request.user.login}`,
              });
              console.log('PR #' + pr + ' merged successfully.');
            } catch (e) {
              // 合并可能因为可合并性尚未就绪而失败（GitHub 后台计算中）
              // 标记为 auto-merge，等状态就绪后 GitHub 自动合并
              try {
                await github.rest.pulls.enableAutoMerge({
                  owner, repo, pull_number: pr,
                  merge_method: 'squash',
                });
                console.log('Auto-merge enabled for PR #' + pr);
              } catch (e2) {
                core.setFailed('Merge failed: ' + e.message + '; auto-merge failed: ' + e2.message);
              }
            }
