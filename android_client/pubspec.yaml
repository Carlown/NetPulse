name: netpulse_mobile
description: NetPulse Android Client - Network stress testing and performance monitoring tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fluent_ui: ^4.8.0
  system_theme: ^3.0.0
  provider: ^6.1.1
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  network_info_plus: ^4.1.0
  permission_handler: ^11.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  open_filex: ^4.3.2
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.2
  web_socket_channel: ^2.4.0
  wakelock_plus: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
